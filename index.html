<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>班级作业系统登录</title>
<link rel="stylesheet" href="style.css">
</head>


<body>


<div class="login-box">

<h1>物联网应用技术XX班</h1>

<h2>登录系统</h2>


<input id="username" 
placeholder="请输入账号">


<input id="password" 
type="password"
placeholder="请输入密码">


<select id="role">

<option value="student">
学生
</option>


<option value="admin">
管理员
</option>

</select>


<button onclick="login()">
登录
</button>


</div>


<script src="login.js"></script>


</body>

</html>
